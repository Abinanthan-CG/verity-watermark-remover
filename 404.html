<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Page not found — Verity</title>
<meta name="robots" content="noindex, follow" />
<meta name="description" content="The page you were looking for does not exist. Head back to Verity, the lossless Gemini watermark remover." />
<meta name="theme-color" content="#0A0A0B" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: #0A0A0B;
    color: #EDEAE4;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  .bloom {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .bloom span { position: absolute; display: block; border-radius: 50%; }
  .bloom span:nth-child(1) {
    width: 70vmax; height: 70vmax; top: -22%; left: -10%;
    background: radial-gradient(circle, rgba(152,130,98,0.32) 0%, rgba(152,130,98,0.10) 32%, transparent 64%);
  }
  .bloom span:nth-child(2) {
    width: 60vmax; height: 60vmax; top: -10%; right: -12%;
    background: radial-gradient(circle, rgba(94,108,120,0.28) 0%, rgba(94,108,120,0.09) 32%, transparent 64%);
  }
  .bloom span:nth-child(3) {
    width: 64vmax; height: 64vmax; bottom: -30%; left: 24%;
    background: radial-gradient(circle, rgba(132,118,98,0.18) 0%, rgba(132,118,98,0.06) 34%, transparent 66%);
  }
  .wrap { position: relative; z-index: 1; max-width: 460px; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 28px;
    display: grid; place-items: center; border-radius: 22px;
    background: #C9C2B4;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 24px 56px -24px rgba(0,0,0,0.95);
  }
  .mark svg { width: 34px; height: 34px; color: #0A0A0B; }
  .code {
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: #9B968D;
    margin: 0 0 14px;
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(34px, 7vw, 48px);
    font-weight: 600; line-height: 1.02; letter-spacing: -0.04em;
    background: linear-gradient(180deg, #F4F1EB 26%, rgba(244,241,235,0.54) 112%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 0 0 32px; font-size: 15px; line-height: 1.55; color: #9B968D; }
  a.btn {
    display: inline-flex; align-items: center; gap: 9px;
    height: 44px; padding: 0 24px; border-radius: 999px;
    background: #C9C2B4; color: #0A0A0B; text-decoration: none;
    font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 12px 28px -14px rgba(0,0,0,0.9);
    transition: background 160ms cubic-bezier(0.32,0.72,0,1), transform 160ms cubic-bezier(0.34,1.56,0.64,1);
  }
  a.btn:hover { background: #E6E0D4; transform: translateY(-2px); }
  a.btn svg { width: 17px; height: 17px; }
</style>
</head>
<body>
  <div class="bloom" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="wrap">
    <span class="mark" aria-hidden="true">
      <svg fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M12 2.6c.62 4.9 3.3 7.55 8.2 8.17-4.9.62-7.58 3.27-8.2 8.17-.62-4.9-3.3-7.55-8.2-8.17 4.9-.62 7.58-3.27 8.2-8.17Z"/>
      </svg>
    </span>
    <p class="code">Error 404</p>
    <h1>This page took a wrong turn</h1>
    <p>The URL you followed doesn&rsquo;t exist. The watermark remover is still right where you left it.</p>
    <a class="btn" href="/">
      <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M19 12H5m0 0 6-6m-6 6 6 6"/>
      </svg>
      Back to Verity
    </a>
  </div>
</body>
</html>
